name: CI

# PR1: la mitad de VERIFICACIÓN del pipeline. No publica nada, no usa
# secretos y no pide permisos de escritura. El job de publicación llega en PR2.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Mínimo privilegio: este workflow sólo lee el repositorio.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Un PR reemplazado es ruido y se cancela; un push a main no se cancela.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fuente única de verdad de la versión de Node: frontend/.nvmrc (22.22.2).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend tests (vitest)
        working-directory: frontend
        # --watch=false está verificado localmente contra el builder
        # @angular/build:unit-test (sin TTY el default ya es false; explícito
        # es a prueba de un runner con TTY).
        run: npx ng test --watch=false

      - name: Production build
        working-directory: frontend
        run: npx ng build --configuration production

      # Gate de limpieza: sin credenciales ni IPs privadas en lo publicable.
      - name: Artifact cleanliness gate
        run: bash deploy/check-artifact.sh frontend/dist/frontend/browser

      - name: Shell syntax check
        run: bash -n deploy/*.sh deploy/tests/*.sh

      - name: Deploy harness
        run: bash deploy/tests/install-lxc.test.sh

      - name: Artifact gate harness
        run: bash deploy/tests/check-artifact.test.sh

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Shellcheck (warning severity)
        run: shellcheck --severity=warning deploy/*.sh deploy/tests/*.sh
